<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111e32"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>Browse | FDA Job Watcher</title></head><body><header><strong>◈ FDA Job Watcher</strong><nav><a href="index.html" >Today</a><a href="browse.html" aria-current="page">Browse</a><a href="market.html" >Market</a></nav></header><main><h1>Browse opportunities</h1><p class="muted">Use filters to narrow current openings. Stars persist in this browser.</p><div class="filters"><label>Scope<select id="scope"><option value="role">Finance / analysis roles</option><option value="all">All jobs</option><option value="star">Starred only</option></select></label><label>Employer<select id="employer"><option value="">All</option></select></label><label>Location<input id="location" placeholder="Any location"></label><label>Days open (minimum)<input id="days" type="number" min="0" value="0"></label><label>Title search<input id="search" placeholder="Financial Analyst"></label><label>First-seen order<select id="sort"><option value="new">Newest</option><option value="old">Oldest</option></select></label></div><p id="total"></p><section class="tablewrap"><table><thead><tr><th>Title</th><th>Employer</th><th>Location</th><th>First seen</th><th>Apply</th></tr></thead><tbody id="rows"></tbody></table></section></main><footer>FDA Job Watcher · Public ATS data · Not a sponsorship guarantee</footer><script src="common.js"></script><script>let all=[],last='';Promise.all([load('history.csv'),load('status.json')]).then(([r,s])=>{all=r;last=(s.run_time||'').slice(0,10);$('#employer').innerHTML+=[...new Set(r.map(x=>x.employer))].sort().map(x=>'<option>'+esc(x)+'</option>').join('');render()});function render(){let saved=JSON.parse(localStorage.getItem('shortlist')||'[]'),scope=$('#scope').value,q=$('#search').value.toLowerCase(),loc=$('#location').value.toLowerCase(),emp=$('#employer').value,min=Number($('#days').value)||0;let rows=all.filter(r=>r.status==='open'&&(scope==='all'||(scope==='star'?saved.includes(r.posting_id):r.in_role==='true'))&&(!emp||r.employer===emp)&&r.title.toLowerCase().includes(q)&&r.location.toLowerCase().includes(loc)&&(!last||days(r.first_seen,last)>=min));rows.sort((a,b)=>$('#sort').value==='new'?b.first_seen.localeCompare(a.first_seen):a.first_seen.localeCompare(b.first_seen));$('#total').textContent=rows.length+' matching positions';$('#rows').innerHTML=rows.slice(0,1000).map(r=>row(r,true)).join('')||'<tr><td colspan="5">No matches</td></tr>'}document.querySelectorAll('.filters input,.filters select').forEach(x=>x.addEventListener('input',render));$('#rows').addEventListener('click',e=>{let b=e.target.closest('.star');if(!b)return;let id=b.dataset.id,saved=JSON.parse(localStorage.getItem('shortlist')||'[]');saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('shortlist',JSON.stringify(saved));render()});</script></body></html>
