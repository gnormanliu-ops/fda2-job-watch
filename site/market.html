<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111e32"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>Market | FDA Job Watcher</title></head><body><header><strong>◈ FDA Job Watcher</strong><nav><a href="index.html" >Today</a><a href="browse.html" >Browse</a><a href="market.html" aria-current="page">Market</a></nav></header><main><h1>Market intelligence</h1><p class="muted">All metrics are calculated in your browser from historical job snapshots. First-run jobs are excluded from duration statistics where required.</p><div id="charts"></div></main><footer>FDA Job Watcher · Public ATS data · Not a sponsorship guarantee</footer><script src="common.js"></script><script>Promise.all([load('history.csv'),load('status.json')]).then(([r,s])=>{let last=(s.run_time||'').slice(0,10),group=(rows,key)=>{let m={};rows.forEach(x=>m[key(x)]=(m[key(x)]||0)+1);return m},output=(head,description,map,extra)=>{let labels=Object.keys(map).sort(),series=[{label:'All positions',values:labels.map(x=>map[x])}];if(extra)series.push({label:'In role',values:labels.map(x=>extra[x]||0)});return {head,description,labels,series}},newJobs=r.filter(x=>x.first_run==='false'),removed=r.filter(x=>x.removed_date),open=r.filter(x=>x.status==='open'),durations=removed.filter(x=>x.first_run==='false').map(x=>days(x.first_seen,x.removed_date)).sort((a,b)=>a-b),med=durations.length?durations.length%2?durations[(durations.length-1)/2]:(durations[durations.length/2-1]+durations[durations.length/2])/2:null,eligible=newJobs.filter(x=>last&&days(x.first_seen,last)>=7),fast=eligible.filter(x=>x.removed_date&&days(x.first_seen,x.removed_date)<=7);let specs=[output('New postings per day','Excludes positions already listed on each source’s first run.',group(newJobs,x=>x.first_seen),group(newJobs.filter(x=>x.in_role==='true'),x=>x.first_seen)),output('Removed postings per day','Dates when previously open positions disappeared from successful source snapshots.',group(removed,x=>x.removed_date)),output('Open postings by employer','Current positions by employer in the latest history.',group(open,x=>x.employer)),output('Median days open: '+(med===null?'N/A':med),'Duration for removed, non-first-run postings.',group(removed.filter(x=>x.first_run==='false'),x=>String(days(x.first_seen,x.removed_date))+' days')),output('Removed within seven days: '+(eligible.length?(100*fast.length/eligible.length).toFixed(1)+'%':'N/A'),'Denominator: non-first-run postings first seen at least seven days before the last run.',group(eligible,x=>x.removed_date&&days(x.first_seen,x.removed_date)<=7?'Removed ≤7 days':'Other')),output('Top locations among open postings','Current open postings by location.',group(open,x=>x.location||'Unknown'))];$('#charts').innerHTML='<section><h2>Historical coverage</h2><p><strong>'+esc(s.days_with_success)+' of 7 required UTC dates</strong> recorded. New jobs exclude first-run positions. Some metrics need additional dates; no synthetic history is inserted.</p><p>Latest successful snapshot: '+esc(s.run_time||'not available')+'</p></section>'+specs.map((x,i)=>{let has=x.labels.length>0;let note=i===0?'No new postings beyond the initial source snapshot yet.':i===1?'No removed postings have been observed yet.':i===3?'No completed lifetimes are available from non-first-run postings yet.':i===4?'No postings have completed the required seven-day observation window yet.':'No observations available.';let sorted=x.labels.map((l,j)=>({label:l,value:x.series[0].values[j]})).sort((a,b)=>b.value-a.value);let summary=(i===2||i===5)&&has?'<div class="tablewrap"><table><thead><tr><th>'+esc(i===2?'Employer':'Location')+'</th><th>Open positions</th></tr></thead><tbody>'+sorted.slice(0,25).map(z=>'<tr><td>'+esc(z.label)+'</td><td>'+z.value+'</td></tr>').join('')+'</tbody></table></div>':'';return '<section><h2>'+esc(x.head)+'</h2><p>'+esc(x.description)+'</p>'+(has?'<canvas id="chart'+i+'"></canvas>'+summary:'<p class="muted">'+esc(note)+'</p>')+'</section>'}).join('');specs.forEach((x,i)=>{if(x.labels.length)bar('chart'+i,x.labels,x.series)})}).catch(e=>$('#charts').textContent=e.message);</script></body></html>
