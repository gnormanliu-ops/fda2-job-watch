<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111e32"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>Today | FDA Job Watcher</title></head><body><header><strong>◈ FDA Job Watcher</strong><nav><a href="index.html" aria-current="page">Today</a><a href="browse.html" >Browse</a><a href="market.html" >Market</a></nav></header><main><h1>Today's job market</h1><p class="muted" id="run">Loading latest snapshot…</p><div class="cards" id="cards"></div><section><h2>Source health</h2><div class="tablewrap"><table><thead><tr><th>Company</th><th>State</th><th>Jobs</th></tr></thead><tbody id="sources"></tbody></table></div></section><section><h2>New postings today</h2><div class="tablewrap"><table><thead><tr><th>Title</th><th>Employer</th><th>Location</th><th>First seen</th><th>Link</th></tr></thead><tbody id="new"></tbody></table></div></section><section><h2>Removed today</h2><div class="tablewrap"><table><thead><tr><th>Title</th><th>Employer</th><th>Location</th><th>First seen</th><th>Link</th></tr></thead><tbody id="removed"></tbody></table></div></section></main><footer>FDA Job Watcher · Public ATS data · Not a sponsorship guarantee</footer><script src="common.js"></script><script>Promise.all([load('status.json'),load('history.csv')]).then(([s,rows])=>{let last=(s.run_time||'').slice(0,10);$('#run').textContent='Last run: '+(s.run_time||'Not run yet')+' (UTC)';$('#cards').innerHTML=[['Successful days',s.days_with_success],['Open postings',s.open],['New today',s.new_today],['Removed today',s.removed_today]].map(x=>'<div class="card"><div class="number">'+x[1]+'</div>'+x[0]+'</div>').join('');$('#sources').innerHTML=(s.sources||[]).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+(x.ok?'OK':'Failed / unconfigured')+'</td><td>'+x.count+'</td></tr>').join('')||'<tr><td colspan="3">No run yet</td></tr>';$('#new').innerHTML=rows.filter(r=>r.first_seen===last&&r.first_run==='false').map(r=>row(r)).join('')||'<tr><td colspan="5">None</td></tr>';$('#removed').innerHTML=rows.filter(r=>r.removed_date===last).map(r=>row(r)).join('')||'<tr><td colspan="5">None</td></tr>'}).catch(e=>$('#run').textContent='Data unavailable: '+e.message);</script></body></html>
